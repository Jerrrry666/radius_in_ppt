<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>R 角调整</title>
  <link rel="stylesheet" href="dialog.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <!-- JSZip for parsing .pptx (Office.js 不支持 getSelectedDataAsync Shape on Mac) -->
  <script src="../shared/jszip.min.js"></script>
  <script src="../shared/radius.js"></script>
  <script src="dialog.js"></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>R 角调整</h1>
      <p class="subtitle">精确设置圆角矩形的 R 角绝对值（厘米）</p>
    </header>

    <section id="status-card" class="status-card status-empty">
      <div class="status-row">
        <span class="status-label">选区</span>
        <span id="status-text" class="status-text">扫描中…</span>
      </div>
      <div class="status-row">
        <span class="status-label">当前 R 角</span>
        <span id="current-radius" class="status-text">—</span>
      </div>
    </section>

    <section class="control-group">
      <div class="list-header">
        <label class="control-label">圆角矩形列表</label>
        <span id="list-count" class="hint">—</span>
      </div>
      <div id="shape-list" class="shape-list">
        <div class="empty-list">扫描文档中…</div>
      </div>
      <div class="list-actions">
        <button id="select-all-btn" class="btn btn-ghost">全选</button>
        <button id="deselect-all-btn" class="btn btn-ghost">全不选</button>
        <button id="rescan-btn" class="btn btn-ghost">重新扫描</button>
      </div>
    </section>

    <section class="control-group">
      <label for="radius-input" class="control-label">R 角数值（厘米）</label>
      <div class="input-row">
        <input
          id="radius-input"
          type="number"
          step="0.01"
          min="0"
          placeholder="0.30"
          inputmode="decimal"
        />
        <span class="unit">厘米</span>
      </div>
      <div class="hint">范围 0 ~ 形状短边 / 2。超过一半时显示为最大圆角。</div>
    </section>

    <section class="control-group">
      <button id="apply-btn" class="btn btn-primary">应用 R 角</button>
    </section>

    <section class="control-group">
      <div class="lock-row">
        <button id="lock-btn" class="btn btn-secondary">
          <span id="lock-icon" class="lock-icon">🔓</span>
          <span id="lock-label">锁定 R 角</span>
        </button>
        <span id="lock-hint" class="lock-hint">未锁定</span>
      </div>
      <div class="hint">
        锁定后，R 角保持厘米值不变；改变形状大小时会自动按比例调整。
      </div>
    </section>

    <section class="control-group">
      <button id="reapply-btn" class="btn btn-ghost">重新应用锁定（针对当前选区）</button>
    </section>

    <section class="control-group diag-section" style="background:#fff8e1;border:1px solid #ffe082;border-radius:6px;padding:10px;">
      <div class="diag-title" style="font-size:12px;color:#856404;font-weight:600;margin-bottom:6px;">🔬 诊断：测试 Office.js 能否读取/写入 PPT 当前选区</div>
      <button id="diag-btn" class="btn btn-ghost" style="font-size:12px;">读取当前选中形状</button>
      <button id="diag-write-btn" class="btn btn-ghost" style="font-size:12px;background:#ffe082;">✍️ 写入测试：把选中形状 R 角设为 0.5cm</button>
      <pre id="diag-out" class="diag-out" style="font-size:11px;color:#333;background:#fff;border:1px solid #ddd;border-radius:4px;padding:6px;margin-top:6px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all;">（先在 PPT 里框选一个圆角矩形，再点上面的按钮）</pre>
    </section>

    <footer class="footer">
      <span>v1.0 · 支持多选 · 仅作用于圆角矩形</span>
    </footer>
  </main>
</body>
</html>
