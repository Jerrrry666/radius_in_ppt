<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1,width=device-width" />
  <title>R 角调整</title>
  <link rel="stylesheet" href="dialog.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <script src="dialog.js"></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>R 角调整</h1>
      <p class="subtitle">精确设置圆角矩形的 R 角绝对值（厘米）</p>
    </header>

    <section id="status-card" class="status-card status-empty">
      <div class="status-row">
        <span class="status-label">选区</span>
        <span id="status-text" class="status-text">读选中…</span>
      </div>
      <div class="status-row">
        <span class="status-label">当前 R 角</span>
        <span id="current-radius" class="status-text">—</span>
      </div>
      <div class="status-row">
        <span class="status-label">已锁定</span>
        <span id="locked-count" class="status-text">—</span>
      </div>
    </section>

    <section class="control-group">
      <div class="list-header">
        <label class="control-label">选中的圆角矩形</label>
        <span id="list-count" class="hint">—</span>
        <button id="rescan-btn" class="btn btn-ghost" style="font-size:11px;padding:2px 6px;">🔄 重新读</button>
      </div>
      <div id="shape-list" class="shape-list">
        <div class="empty-list">在 PPT 里框选形状后会出现在这里</div>
      </div>
    </section>

    <section class="control-group">
      <label for="radius-input" class="control-label">R 角数值（厘米）</label>
      <div class="input-row">
        <input
          id="radius-input"
          type="number"
          step="0.01"
          min="0"
          placeholder="0.30"
          inputmode="decimal"
        />
        <span class="unit">厘米</span>
      </div>
      <div class="hint">范围 0 ~ 形状短边 / 2。超过一半显示为最大圆角。</div>
    </section>

    <section class="control-group">
      <button id="apply-btn" class="btn btn-primary" disabled>应用 R 角</button>
    </section>

    <section class="control-group">
      <div class="lock-row">
        <button id="lock-btn" class="btn btn-secondary" disabled>
          <span id="lock-icon" class="lock-icon">🔓</span>
          <span id="lock-label">锁定 R 角</span>
        </button>
        <span id="lock-hint" class="lock-hint">读选中…</span>
      </div>
      <div class="hint">锁定后 R 角按厘米值保持；改变形状大小时自动按比例调整。</div>
    </section>

    <section class="control-group">
      <button id="reapply-btn" class="btn btn-ghost" disabled>重新应用锁定（针对当前选区）</button>
    </section>

    <footer class="footer">v2.0 · 纯 Office.js · 无 server 依赖</footer>
  </main>
</body>
</html>
